site_name: NereidAI
site_description: >-
  Navigate the sea of data — from devices to models to edge intelligence. An
  end-to-end, air-gapped, multi-silicon AIoT platform: VLM-assisted annotation,
  LLM/VLM and vision-model training, quantization, multi-vendor export, offline
  edge distribution and inference feedback. IoT and AI in one private loop.
site_url: https://nereidai.github.io
repo_url: https://github.com/NereidAI
repo_name: NereidAI
edit_uri: ''
copyright: Copyright &copy; 2026 YIQISOFT — Apache License 2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: docs/theme/overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - theme/custom.css

extra_javascript:
  - assets/guide-scope.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            首页: 首页
            Products: 产品
            Suite Overview: 套件总览
            Solutions: 商业解决方案
            Architecture: 架构
            Overview: 概览
            Topology: 部署拓扑
            Cross-Product Contracts: 跨产品契约
            Deployment: 部署
            Air-Gapped Install: 气隙安装
            Kubernetes & Helm: Kubernetes 与 Helm
            Edge Delivery: 边缘分发
            Security: 安全
            SSO & OIDC: SSO 与 OIDC
            RBAC: RBAC 权限模型
            Development: 开发
            API Integration: API 对接
            Authentication Flows: 认证流程
            Getting Started: 快速开始
            Contributing: 贡献指南
            Conventions: 代码规范
            Community & Support: 社区与支持
            License: 开源许可
            Community vs Enterprise: 社区版与企业版
            Roadmap: 路线图
            Support: 支持
            Reference: 参考
            Naming & Abbreviations: 命名与简写
            Glossary: 术语表
            About: 关于
            About NereidAI: 关于 NereidAI
            Guides: 使用指南
            Monitoring: 监控
            Devices: 设备
            Configuration: 配置
            Operations: 运营
            Integration: 集成
            SDK (Go): SDK（Go）
            Device SDK (Go): 设备 SDK（Go）
            Adapter SDK (Go): 适配器 SDK（Go）
            System: 系统

# Site analytics. Both ids are public client-side values, safe to commit:
# Google Analytics 4 (Material built-in) and Baidu Tongji (override template).
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NereidAI
  generator: false
  analytics:
    provider: google
    property: G-LY0H7TXKXG
  baidu_tongji:
    id: 269d4b8dfd17fe64f979e29c094ed716

